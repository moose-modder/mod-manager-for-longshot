name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # a run takes about 5 minutes; a slow package mirror can make it hours (GitHub's own limit is 6)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The app's window (Tauri) needs WebKitGTK on Linux. Normally a minute: a mirror sending it at a crawl stops
      # the run here, to be run again.
      - if: runner.os == 'Linux'
        name: Packages
        timeout-minutes: 15
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      # rustup installs the toolchain pinned in rust-toolchain.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
